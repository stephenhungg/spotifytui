[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotifytui"
version = "2.0.0"
description = "A terminal UI for Spotify with AI-powered recommendations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Stephen Hung", email = "stephenhung@berkeley.edu"},
]
keywords = ["spotify", "tui", "terminal", "music", "player", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "textual>=0.80.0",
    "spotipy>=2.23.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "lyricsgenius>=3.0.1",
    "Pillow>=10.0.0",
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/stephenhungg/spotifytui"
Issues = "https://github.com/stephenhungg/spotifytui/issues"
Source = "https://github.com/stephenhungg/spotifytui"

[project.scripts]
spotifytui = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "main",
    "app",
    "config",
    "album_art",
    "spotify_client",
    "lyrics_service",
    "vibechain_client",
    "feature_estimator",
    "logging_config",
]
packages = ["widgets"]

[tool.setuptools.package-data]
"*" = ["*.tcss"]
